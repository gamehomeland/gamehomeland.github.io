name: Build page branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Check publication links
        run: node scripts/configure-site.mjs --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check data and types
        run: pnpm catalog && pnpm typecheck
      - name: Test export core
        run: pnpm test
      - name: Test resource and blueprint tools
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 -m unittest discover -s tests -p '*_test.py'
      - name: Verify structure example
        run: |
          pnpm example:structure
          python3 tools/inspect_blueprint.py artifacts/structure-example/four-cells.blueprintx --output artifacts/structure-example/fields.json
      - name: Build website
        run: pnpm build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ${{ runner.temp }}/website
      - name: Publish page branch
        run: |
          test -s "$RUNNER_TEMP/website/index.html"
          git fetch --no-tags --depth=1 origin page
          git worktree add --detach "$RUNNER_TEMP/page" FETCH_HEAD
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/website/" "$RUNNER_TEMP/page/"
          git -C "$RUNNER_TEMP/page" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/page" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/page" add --all
          if git -C "$RUNNER_TEMP/page" diff --cached --quiet; then
            echo '网站产物未变化，跳过提交。'
            exit 0
          fi
          git -C "$RUNNER_TEMP/page" commit -m "自动构建网站：${GITHUB_SHA}"
          git -C "$RUNNER_TEMP/page" push origin HEAD:page
